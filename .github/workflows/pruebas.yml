# GitHub ejecuta las pruebas automáticamente cada vez que se suben cambios.
# El resultado aparece en la pestaña "Actions" del repositorio.
name: Pruebas del backend

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
