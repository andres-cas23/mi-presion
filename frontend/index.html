<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Presión</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
<!-- Letra Atkinson Hyperlegible: diseñada para personas con baja visión -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<!-- Estilos: base (colores y letra) -> estructura (menú) -> componentes (piezas) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/estructura.css">
<link rel="stylesheet" href="css/componentes.css">
</head>
<body>

<!-- Pantalla de acceso: la llena js/vistas/acceso.js -->
<div id="pantalla-acceso" class="acceso" hidden></div>

<!-- Aplicación: menú + contenido. El contenido lo llena cada archivo de js/vistas/ -->
<div id="pantalla-app" class="marco" hidden>
  <nav class="menu" aria-label="Menú principal">
    <div class="marca">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/></svg>
      Mi Presión
    </div>
    <a href="#/inicio" data-ruta="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Inicio</a>
    <a href="#/mediciones" data-ruta="mediciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span class="largo">Mediciones</span><span class="corto">Medir</span></a>
    <a href="#/asistente" data-ruta="asistente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg>Asistente</a>
    <a href="#/informes" data-ruta="informes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>Informes</a>
    <a href="#/aprender" data-ruta="aprender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Aprender</a>
    <a href="#/perfil" data-ruta="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="largo">Mi perfil</span><span class="corto">Perfil</span></a>
    <div class="texto-tam">
      <p id="lbl-texto">Tamaño del texto</p>
      <div role="group" aria-labelledby="lbl-texto">
        <button data-tam="normal" aria-label="Texto normal">A</button>
        <button data-tam="grande" aria-label="Texto grande" style="font-size:1.15em">A</button>
        <button data-tam="muy-grande" aria-label="Texto muy grande" style="font-size:1.35em">A</button>
      </div>
    </div>
  </nav>
  <main id="contenido" tabindex="-1" aria-live="polite"></main>
</div>

<div id="toast" role="status" hidden></div>
<div id="despertando" role="status" hidden>El servidor gratuito se está despertando. Puede tardar hasta un minuto…</div>

<!-- Punto de entrada del frontend -->
<script type="module" src="js/main.js"></script>
</body>
</html>
